name: Android release
# 署名した AAB を作る。secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD）を入れてから手で実行する。
# PLAY_SERVICE_ACCOUNT_JSON があれば Google Play の内部テストに自動で送る。無ければ AAB を artifact に置くので、Play Console に手でアップロードする。
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: node test/core.test.js
      - run: npx cap sync android
      - name: 署名鍵を置く
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "ANDROID_KEYSTORE_BASE64 がありません"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: 署名した AAB をビルド（versionCode は実行番号）
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -q \
            -PversionCode=$GITHUB_RUN_NUMBER \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tail -30
          ls -la app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Google Play の内部テストに送る（PLAY_SERVICE_ACCOUNT_JSON があるとき）
        if: ${{ env.HAS_SA == 'true' }}
        env:
          HAS_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.company256.seikyusho
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: 署名鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
